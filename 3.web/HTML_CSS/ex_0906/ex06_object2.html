<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //자바스크립트 객체의 특징
        let person = { name:'홍길동', age:30 };
        //객체에 들어있는 내용 출력하는 법
        document.write('person.name :',person.name,'<br>')
        document.write('person.age :',person.age,'<br>')
        document.write('<hr>')
        document.write("person['name'] :",person['name'],'<br>')

        //프로퍼티 추가하기
        person.bt='AB';
        document.write('person.bt :',person.bt,'<br>')

        //객체에서 프로퍼티 삭제
        //delete
        delete person.bt;
        document.write("person['bt'] :",person['bt'],'<br>')
        //프로퍼티가 객체에 속해 있는지 확인하는 방법
        //in 연산자 사용
        document.write('name in person :','name' in person,'<br>') // true
        document.write('name in address :','address' in person,'<br>') //false
        document.write(person) //타입나옴
        document.write('<hr>')
        //for-in
        for(i in person){
            document.write(`${i}=${person[i]}<br>`)
        }
        //새로운 객체에 기존 객체를 참조할 수 있다.
        let person2 = person;
        person.age=40;
        document.write('person2.age :',person2['age'],'<br>')

        //객체안에 객체가 들어갈 수 있다, 배열도 들어갈 수 있다.
        let circle={
            center:{x:1.0,y:2.0},
            radius :2.5
        }
        document.write(`circle.center.x : ${circle.center.x},circle.center.y : ${circle.center.y}`) 
        document.write(`radius : ${circle.radius}<br>`)
        
        //프로퍼티에 함수가 들어갈 수 있다.
        //객체 안에 들어있는 함수를 메서드라고 한다.
        let person3={
            name : '홍길동',
            age : 30,
            getInfo : function(){
                document.write(`이름 : ${this.name}<br> 나이:${this.age}<br>`);
            }
        }
        person3.getInfo();

        //프로퍼티 추가
        person.name='hong'
        person.gender='male'
        person.sayHello=function(){
            document.write('Hi! my name is',this.name);
        }
        document.write(person.name,'<br>');
        person.sayHello();

        //생성자 함수 만들기
        //생성자 함수 이름은 일반적으로 대문자
        function Person(name,gender){
            let merrid = true //private --외부참조 불가
            this.name=name; //public
            this.gender=gender;
            this.sayHello = function(){
                document.write('<br>Hi! my name is',this.name);
                document.write('<br>'+ merrid)
            }
        }
        let person4 = new Person('Lee','male')
        let person5 = new Person('Kim','female')
        console.log(person4);
        console.log(person5);
        console.log(person4.merried); // 접근불가 undefind
        console.log(person4.sayHello()) //메서드로 부를 수 있다.
    </script>
</head>
<body>
    
</body>
</html>
