<!DOCTYPE html>
<html lang="en">
<head> <!--자원의 초기화되는 것들 넣는다-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script> 
        for(var i = 6; i>=1; i--){
            //document ----body를 의미하는 객체
            //document.write(택스트) : 텍스트를 body에 출력하겠다.
            document.write('<h'+i+'>'+'자바스크립트'+'</h'+i+'>');           
        }
        for(var i = 6; i>=1; i--){
            //document ----body를 의미하는 객체
            //document.write(택스트) : 텍스트를 body에 출력하겠다.
            document.write(`<h${i}>자바스크립트</h${i}>`);           
        }
    </script>
</head>
